<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TEGA Awards Portal</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <script>
    // SPA redirect for Netlify - redirects all 404s back to the SPA
    var pathSegmentsToKeep = 0;
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
  <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:Arial,sans-serif;background:#0a0a0a;color:#fff;text-align:center;padding:20px;">
    <img src="/tega-logo.png" alt="TEGA Logo" style="width:128px;margin-bottom:24px;" />
    <h1 style="font-size:24px;margin-bottom:8px;">Redirecting...</h1>
    <p style="color:#888;">If you are not redirected, <a href="https://portal.transformingeducation.ac" style="color:#D4A017;">click here</a>.</p>
  </div>
</body>
</html>
